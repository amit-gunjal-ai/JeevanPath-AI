<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JeevanPath AI - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            🌱
        </div>

        <h1>JeevanPath <span>AI</span></h1>

        <p class="tagline">
            Your Personal Livelihood Navigator
        </p>


        <!-- Login Card -->
        <div class="login-card">

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to continue your journey
            </p>


            <!-- Mobile Number -->
            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter your mobile number"
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <!-- Forgot Password -->
            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>


            <!-- Login Button -->
            <button class="login-btn">
                Login →
            </button>


            <!-- Register -->
            <p class="register">
                New user?
                <a href="#">Create Account</a>
            </p>

        </div>


        <p class="footer-text">
            🎙️ Voice-first • Simple • Personalized
        </p>

    </div>

</body>
</html>
